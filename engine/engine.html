<style>
/* One look: an illustrated cast over Category standard type, with Wayfinding's line-and-stops progress.
   Everything sits on a 12-column grid with a 24px gutter.
   Company colors are hints: fills, bars, rings and rules on that case's slides only; text stays in ink. */
:root {
  --audience: /*AUDIENCE_COLOR*/;
  --gut: 24px;
  --live: #B1060F; /* the presenter's listening dot and offline status */
}
:root {
  --paper: #F3F4F7; --panel: #FFFFFF; --ink: #232836; --muted: #5A6172; --hair: #D5D9E1; --line: #3A4052;
  --accent: #D9563F; --accent-ink: #B8432F;
  --display: "Geist", system-ui, sans-serif; --body: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --claim-size: 96px; --claim-weight: 500; --claim-track: -0.04em;
  --r: 16px; --sw: 1.5; --gridtint: rgb(217 86 63 / 5%);
  --lift: 0 1px 2px rgb(20 24 40 / 6%), 0 12px 30px -18px rgb(20 24 40 / 25%);
}
section { --case: var(--accent); --case-ink: var(--accent-ink); }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; }
::selection { background: var(--ink); color: var(--paper); }
.reveal-viewport { background: var(--paper); }
.reveal { font-family: var(--body); color: var(--ink); font-size: 26px; }
.reveal .slides { text-align: left; }
.reveal .slides section { padding: 0; height: 100%; box-sizing: border-box; }
.reveal .progress { color: var(--ink); height: 2px; }
.reveal .controls { color: var(--ink); }

/* The scene is a 12-column grid: the claim spans 12, the drawing field and footer span 12. */
.scene { position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gut); grid-template-rows: auto 1fr auto; row-gap: 28px; height: 100%; box-sizing: border-box; padding: 40px 48px 0; }
.reveal h2.claim { grid-column: 1 / -1; font-family: var(--display); font-weight: var(--claim-weight); font-size: var(--claim-size); line-height: 0.98; letter-spacing: var(--claim-track); margin: 0; text-wrap: pretty; color: var(--ink); text-transform: none; }
.reveal h2.claim em { font-style: normal; color: var(--case-ink); }
.reveal h2.claim > div { padding-bottom: 0.16em; margin-bottom: -0.16em; }
.viz { grid-column: 1 / -1; position: relative; min-height: 0; }
/* Optional caption under the claim (deck.py CAPTIONS = True); today scenes say so above it */
.scene.has-cap { grid-template-rows: auto auto 1fr auto; row-gap: 22px; }
.cap { grid-column: 1 / span 10; margin: -6px 0 0; font-size: 23px; line-height: 1.4; color: var(--muted); max-width: 64ch; text-wrap: pretty; }
.cap .tt { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--case-ink); margin-bottom: 4px; }
/* Case context: where, when, team, role, then the problem; an eyebrow names the case above the claim */
.reveal section[data-build="context"] h2.claim { font-size: calc(var(--claim-size) * .8); }
section[data-build="context"] .cap.org { color: var(--case-ink); font-weight: 600; font-size: 22px; letter-spacing: .01em; }
section[data-build="context"] .scene.has-cap { grid-template-rows: auto auto auto 1fr auto; }
.ctx { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 3fr); gap: 40px; align-items: start; margin-top: 18px; }
.ctx .vign { margin: 0; border-radius: var(--r); }
.ctx .facts { display: flex; flex-direction: column; gap: 30px; }
.ctx .frow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gut); border-top: 4px solid var(--case); padding-top: 16px; }
.ctx .k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--case-ink); }
.ctx .fc p { margin: 8px 0 0; font-size: 25px; line-height: 1.3; letter-spacing: -0.01em; }

.eyebrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; margin-bottom: -6px; }

.eyebrow .mk img { height: 44px; max-width: 110px; display: block; object-fit: contain; }

/* Tags on case cards (CASE_TEXT tags in deck.py), and a contact line on the thank-you */
.case-card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.case-card .tags i { font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--ink); background: color-mix(in srgb, var(--k) 12%, var(--panel)); border-radius: 999px; padding: 3px 7px; white-space: nowrap; }
.contact { margin: 26px 0 0; font-size: 18px; color: var(--muted); }
.contact b { color: var(--ink); font-weight: 600; }
.viz svg { width: 100%; height: 100%; display: block; overflow: visible; }
.foot { grid-column: 1 / -1; }
/* G shows the column grid */
.show-grid .viz { background-image: linear-gradient(to right, var(--gridtint) 0 calc(100% - var(--gut)), transparent calc(100% - var(--gut))); background-size: calc((100% + var(--gut)) / 12) 100%; }
.show-grid .viz { --gridtint: rgb(229 9 20 / 9%); }

/* Footer: case, guide question, progress, sheet number, on the same 12 columns */
.foot { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gut); align-items: center; font-size: 11px; color: var(--muted); }
.foot > * { display: flex; align-items: center; gap: 8px; padding: 11px 0; min-width: 0; }

.foot .q.now::before { content: var(--q-now, "Probe"); color: var(--case-ink); }

.trail { grid-column: span 2; gap: 5px; }
.trail i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); box-sizing: border-box; }
.trail i.on { background: var(--case); border-color: var(--case); }
.trail i.done { background: var(--muted); border-color: var(--muted); }
.sheet { grid-column: span 1; justify-content: flex-end; font-size: 10.5px; color: var(--ink); white-space: nowrap; }

/* SVG marks take the look's tokens */
.lbl { font-family: var(--body); fill: var(--ink); font-size: 17px; }
.lbl.sm { font-size: 12px; fill: var(--muted); }
.lbl.mono { font-size: 10px; letter-spacing: .1em; fill: var(--muted); text-transform: uppercase; }

.lbl.hd { font-family: var(--display); font-weight: 600; font-size: 28px; letter-spacing: -0.015em; }
.lbl.acc { fill: var(--case-ink); }
.lbl.h3 { font-family: var(--display); font-weight: 600; font-size: 23px; letter-spacing: -0.01em; }

.lbl.md.big2 { font-size: 20px; }
.lbl.h3s { font-family: var(--display); font-weight: 600; font-size: 19px; }
.sheet-hd { fill: #E6F4EA; }
.sheet-ln { stroke: #1E8E3E; stroke-opacity: .45; }
.pill.on { fill: #DDF1E7; } .pill.risk { fill: #FDE8C9; } .pill.off { fill: #E7E9EE; }
.lbl.pill-t { fill: var(--ink); font-size: 11.5px; }
.flow4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gut); align-content: start; }
.flow4 .col { gap: 12px; }
.flow4 .chip { font-size: 16px; }
.then-line { margin: 0 0 18px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mini { fill: var(--panel); stroke: var(--hair); stroke-width: 1; }
.mini-bar.pre, .mini-hot.pre { fill: #F2A193; }
.mini-bar.post { fill: #3A3F4B; }
.mini-cell { fill: var(--hair); }
.mini-screen { fill: #2E333D; }
.lbl.inv { fill: var(--paper); }
.ln { stroke: var(--hair); stroke-width: var(--sw); fill: none; }
.ln.ink { stroke: var(--line); }
.ln.acc { stroke: var(--case); }
.ln.dash { stroke-dasharray: 5 6; }
.box { fill: var(--panel); stroke: var(--line); stroke-width: var(--sw); }
.box.soft { stroke: var(--hair); }
.box.acc { fill: color-mix(in srgb, var(--case) 12%, var(--panel)); stroke: var(--case); }
.box.solid { fill: var(--case); stroke: var(--case); }
.box.ghost { fill: none; stroke: var(--muted); stroke-dasharray: 6 6; }
.dot { fill: var(--muted); }
.dot.acc { fill: var(--case); }
.dot.ink { fill: var(--ink); }
.cyc .lbl.tick { fill: var(--muted); transition: fill .4s; }
.cyc .lbl.tick.on { fill: var(--case-ink); }
.cyc .lbl.muted { fill: var(--muted); }
.bar { fill: var(--hair); }
.bar.acc { fill: var(--case); }
.ring-bg { fill: color-mix(in srgb, var(--case) 9%, var(--panel)); }
.ring { fill: none; stroke: color-mix(in srgb, var(--case) 45%, transparent); stroke-width: 1.25; }

/* HTML pieces: equal splits of the 12 columns */
.chip { font-size: 15px; line-height: 1.32; padding: 9px 12px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--hair); color: var(--ink); }
.chip.person::before, .chip.agent::before { display: block; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
.chip.person { border-color: var(--line); }
.chip.person::before { content: "A person"; color: var(--muted); }
.chip.agent { border-color: var(--case); background: color-mix(in srgb, var(--case) 9%, var(--panel)); }
.chip.agent::before { content: "An agent"; color: var(--case-ink); }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gut); align-content: start; }
.col { border-top: 3px solid var(--case); background: var(--panel); border-radius: var(--r); padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--case-ink); }

.col p.m { color: var(--muted); }

.strip { margin: 22px 0 0; font-size: 16px; color: var(--muted); border-top: 1px solid var(--hair); padding-top: 14px; }
.strip b { color: var(--ink); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gut); align-content: start; }
.tile { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tile .name { font-family: var(--display); font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
.parts .tile p { font-size: 17px; color: var(--ink); }
/* Prototypes, practice drawings, month plans, tiles and cards: shared pieces (kept in this order; later blocks override them) */
.protos { transition: grid-template-columns .6s cubic-bezier(.2,.7,.2,1); }
.protos .tile { transition: opacity .4s, filter .4s; }
.protos.focusing .tile:not(.on) { opacity: .38; filter: saturate(.15); }
.protos .demo { aspect-ratio: 400 / 240; border-radius: 10px; background: color-mix(in srgb, var(--accent) 6%, var(--paper)); overflow: hidden; margin-bottom: 6px; }
.demo svg, .nv svg { width: 100%; height: 100%; display: block; }
.demo text, .nv text { font-family: var(--body); font-size: 11px; fill: var(--ink); }
.demo text.m, .nv text.m { font-size: 9.5px; fill: var(--muted); }
.demo text.b, .nv text.b { font-weight: 600; }
.demo text.w, .nv text.w { fill: #FFFFFF; }
.demo .a, .nv .a { transform-box: fill-box; transform-origin: 50% 50%; }
.protos .demo .a { animation-play-state: paused !important; }
.protos .tile.on .demo .a { animation-play-state: running !important; }
.nv { aspect-ratio: 400 / 220; margin: -4px -6px 4px; }
.nv .a { animation-play-state: paused !important; }
.reveal section.present .nv .a { animation-play-state: running !important; }
@keyframes wave { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.months .col { position: relative; }
.months .col p { font-size: 17px; }
.months .outcome { margin-top: auto !important; padding-top: 12px; border-top: 1px solid var(--hair); color: var(--ink); }
.months .outcome b { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--case-ink); margin-bottom: 4px; font-weight: 600; }
.months .next { position: absolute; right: -22px; top: 50%; transform: translate(50%, -50%) rotate(90deg); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tile p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
.tile .tag { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gut); align-content: start; }
.card { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px 16px; font-size: 15px; line-height: 1.35; min-width: 0; }
.card .who { display: block; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.card.agent { border-color: var(--case); background: color-mix(in srgb, var(--case) 9%, var(--panel)); }
.card.agent .who { color: var(--case-ink); }
/* Thank you: the four stories again, small, with their vignettes still moving */
.recap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gut); }
.rc { --case: var(--k); background: var(--panel); border-radius: var(--r); box-shadow: var(--lift); overflow: hidden; padding: 0 20px 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rc .mk { height: 30px; display: flex; align-items: center; margin-top: 4px; }
.rc .mk img { max-height: 30px; max-width: 150px; display: block; }
.rc .nm { font-family: var(--display); font-weight: 500; font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; }
.for { display: flex; align-items: center; gap: 14px; margin-top: 40px; font-size: 15px; color: var(--muted); }
.for svg { height: 26px; width: auto; display: block; }
.for .z { fill: var(--audience); }
/* Case map */
.cases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gut); align-content: start; }
.case-card { --case: var(--k); min-height: 330px; box-sizing: border-box; text-align: left; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--hair); border-top: 6px solid var(--k); border-radius: var(--r); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-width: 0; transition: transform .3s cubic-bezier(.2,.7,.2,1), border-color .2s; }
.case-card:hover { transform: translateY(-4px); border-color: var(--k); }
.case-card:focus-visible { outline: 3px solid var(--k); outline-offset: 3px; }
.case-card .n { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.case-card .org { font-size: 38px; line-height: 1; }
.case-card .nm { font-family: var(--display); font-weight: 500; font-size: 28px; line-height: 1.12; letter-spacing: -0.02em; }
.case-card .cq { font-size: 12px; line-height: 1.4; color: var(--muted); }
.case-card.done { background: color-mix(in srgb, var(--panel) 55%, transparent); box-shadow: none; }
.case-card.done .vign { filter: saturate(.18); opacity: .7; }

.case-card.next { box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--k) 70%, transparent); transform: translateY(-6px); border-color: var(--k); }

/* With tags, four cards across: shorter vignettes and smaller names so the map clears the footer */
.cases.tagged .vign { aspect-ratio: 400 / 150; }
.cases.tagged .case-card { min-height: 0; }
.cases.tagged .case-card .org { font-size: 30px; }
.cases.tagged .case-card .nm { font-size: 23px; }
.also { margin-top: 24px; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.also button { font: 500 14px var(--body); color: var(--ink); background: none; border: 1px solid var(--hair); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.also button:hover, .also button:focus-visible { border-color: var(--ink); outline: none; }
/* Then and today */
.steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.steps span { font-size: 11px; color: var(--muted); border: 1px solid var(--hair); border-radius: 999px; padding: 4px 12px; }
.steps span.on { color: var(--ink); border-color: var(--case); background: color-mix(in srgb, var(--case) 12%, transparent); font-weight: 600; }
.tn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gut); align-items: start; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--hair); }
.side.today .k { color: var(--case-ink); border-color: var(--case); }
.side.then .chip { color: var(--muted); background: transparent; border-style: dashed; }

.col, .tile, .card, .case-card { border: 0; box-shadow: var(--lift); }
.col { border-top: 0; box-shadow: inset 0 4px 0 var(--case), var(--lift); }
.case-card { border-top: 0; overflow: hidden; padding-top: 0; }

.vign { margin: 0 -20px 8px; aspect-ratio: 400 / 210; background: color-mix(in srgb, var(--k) 8%, var(--panel)); overflow: hidden; }
.vign svg { width: 100%; height: 100%; display: block; }
.vign .a { transform-box: fill-box; transform-origin: 50% 100%; animation-play-state: paused; }
.vign .c { transform-origin: 50% 50%; }
.reveal section.present .vign .a, .reveal section.present .vign .flow { animation-play-state: running; }
.vign .flow { stroke: var(--flow, var(--ink)); stroke-opacity: .5; stroke-width: 2; stroke-dasharray: 4 7; stroke-linecap: round; animation: flow 1.4s linear infinite paused; }
.vign .puff { fill: #E9E3DE; }
.bob { animation: bob 3.2s ease-in-out infinite; }
.float { animation: bob 4s ease-in-out infinite; --amp: -6px; }
.breathe { animation: bob 3.6s ease-in-out infinite; --amp: -2px; }
.vign .wavehand { transform-origin: 79.8% 19.3%; animation: wavehand 1.4s ease-in-out infinite; }
.puff { animation: puff 3.6s ease-out infinite; }
.twinkle { animation: twinkle 2.2s ease-in-out infinite; }
.sway { animation: sway 4.5s ease-in-out infinite; }
.drift { animation: drift 14s ease-in-out infinite; }
.vign .shimmer { fill: #FFFFFF; animation: twinkle 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(var(--amp, -3px)); } }
@keyframes wavehand { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(12deg); } }
@keyframes puff { 0% { transform: translateY(0) scale(.5); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-24px) scale(1.25); opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -22; } }
@keyframes twinkle { 0%, 100% { transform: scale(.72); opacity: .55; } 50% { transform: scale(1.06); opacity: 1; } }
@keyframes sway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
@keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(40px); } }
/* Reduced motion and print hold each vignette on its last frame (a vignette's base attributes are that frame) */
@media (prefers-reduced-motion: reduce) { .vign .a, .vign .flow { animation: none !important; } .vign video { display: none; } }
html.print-pdf .vign .a, html.print-pdf .vign .flow { animation: none !important; }
html.print-pdf .vign video { display: none; }
html.print-pdf .tools { display: none; }
html.print-pdf .cameo { filter: none; } /* a drop shadow makes Chrome print the figure as a large bitmap */
html.print-pdf .protos .demo .a { animation-delay: -8s !important; animation-play-state: paused !important; } /* print each prototype demo frozen at 80% of its 10s loop, where every demo shows one finished view */

const splits = new Map(); let current = null;
// Play-once vignettes (finite CSS animations, and any <video> movie) start from the top each time their slide plays, so
// they never finish off screen; movies elsewhere stop. Reduced motion and print hide a movie and show the still beneath it.
// A movie's side bands take the colour of its background near the corner, as this browser decodes it, so they never show as a tint
document.addEventListener("loadeddata", e => { const v = e.target; if (!v.matches || !v.matches(".vign .movie video")) return;
  try { const c = document.createElement("canvas"); c.width = 64; c.height = 36; c.getContext("2d").drawImage(v, 0, 0, 64, 36);
    const [r, g, b] = c.getContext("2d").getImageData(2, 2, 1, 1).data; /* a little in from the corner, where encoders darken the edge */ v.parentElement.style.setProperty("--mbg", `rgb(${r},${g},${b})`); } catch (err) {} }, true);

function vignPlay(sec) {
  document.querySelectorAll(".vign video").forEach(v => { if (!sec || !sec.contains(v)) { clearTimeout(v._hold); v.pause(); } });
  if (!sec || reduce || document.documentElement.classList.contains("print-pdf")) return;
  sec.querySelectorAll(".vign .a").forEach(el => el.getAnimations().forEach(an => { if (an.effect.getTiming().iterations !== Infinity) { an.currentTime = 0; an.play(); } }));
  sec.querySelectorAll(".vign video").forEach(v => { // the movie's overlay follows the movie's clock, so they can't drift apart
    const ov = [...v.closest(".vign").querySelectorAll(".a")].flatMap(el => el.getAnimations());
    ov.forEach(an => { an.pause(); an.currentTime = 0; }); // held on the first frame (data-hold seconds) before the movie starts
    v.ontimeupdate = () => ov.forEach(an => { if (Math.abs(an.currentTime - v.currentTime * 1000) > 120) an.currentTime = v.currentTime * 1000; });
    v.onplaying = () => ov.forEach(an => { an.currentTime = v.currentTime * 1000; an.play(); });
    v.onended = () => ov.forEach(an => an.finish());

  });
}

function play(sec) {

function cameoVideo(sec) {

const notesEl = document.getElementById("notes"), notesInner = notesEl.querySelector(".inner");

const stepAt = (steps, f) => Math.max(0, Math.min((f ?? -1) + 1, steps.length - 1));
// The next key-press label on this slide, or "" when the next key moves to the next slide
function nextKey(id, f) { const steps = NOTES[id] || [], s = stepAt(steps, f); return s < steps.length - 1 ? steps[s + 1].label : ""; }

  return head + noteHTML(st.items) + (keyLine ? `<p class="k">Next key: <b>${esc(nextKey(id, f) || "next slide")}</b></p>` : "");

const toastEl = document.getElementById("toast"); let toastT;
function toast(msg, ms = 9000) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, ms); }

/* Notes screen: a second window of this same deck link. The two windows talk over a BroadcastChannel,

const chan = "BroadcastChannel" in window ? new BroadcastChannel("/*CHANNEL*/") : null;

if (chan) chan.onmessage = e => receive(e.data);

document.getElementById("btn-role").addEventListener("click", becomeNotes);

/* Teleprompter: listens through the platform's dictation, finds your place in the current key press's notes
   (Tele.align, forward only, skips allowed), dims what's been said and glides your place up the screen.
   Learning: each key press you speak through leaves a private record (how much of each paragraph you said, the
   phrases you ad-libbed, what you said), under data/users/<you>/prompter/visits. Paragraphs you skipped in two of
   your last three runs fold down; Claude reads the records to propose rewrites of the notes themselves. */
function teleprompter(col, btn, note, learnBtn) {
  let words = [], spans = [], paras = [], els = [], blocks = [], cursor = 0, key = "", last = [], finals = [], partial = [], base = 0, d = null;
  let hits = new Set(), visit = null, segs = [], partialRaw = "", moved = false, phraseFrom = -1, saveT;
  const scroller = document.scrollingElement;
  const RUN = Date.now().toString(36); let seq = 0;
  const store = { rows: [], save: null }; // rows: past visits, newest first
  let learn = true; try { learn = localStorage.getItem("prompter-learn") !== "off"; } catch (e) {}
  const pkey = (id, x) => id + ":" + Tele.words(x).slice(0, 8).join(" ");
  const usuallySkipped = k => {
    const h = store.rows.flatMap(r => (r.paras || []).filter(p => p.key === k).map(p => p.said)).slice(0, 3);
    return h.length >= 3 && h.filter(r => r < 0.15).length >= 2;
  };
  function show(id, f) {
    const steps = NOTES[id] || [], s = steps.length ? stepAt(steps, f) : 0, k = id + ":" + s;
    if (k === key) return; save(); key = k; last = [id, f];
    words = []; spans = []; paras = []; let n = 0;
    const em = EMPH[id] || [];
    const prose = x => {
      const marks = new Uint8Array(x.length);
      for (const ph of em) for (let i = x.indexOf(ph); i >= 0; i = x.indexOf(ph, i + 1)) marks.fill(1, i, i + ph.length);
      let out = "", pos = 0;
      for (const m of x.matchAll(/\S+/g)) {
        for (const w of Tele.words(m[0])) { words.push(w); spans.push(n); }
        out += esc(x.slice(pos, m.index)) + `<span class="w${marks[m.index] ? " em" : ""}">${esc(m[0])}</span>`; n++; pos = m.index + m[0].length;
      }
      return out + esc(x.slice(pos));
    };
    const para = x => {
      const pk = pkey(id, x), from = words.length, html = prose(x); paras.push({ key: pk, from, to: words.length });
      return usuallySkipped(pk) ? `<p class="fold"><span class="fold-l">Usually skipped</span>${html}</p>` : `<p>${html}</p>`;
    };
    if (!steps.length) col.innerHTML = `<p class="d">No notes for this slide.</p>`;
    else {
      const st = steps[s];
      const head = steps.length > 1 ? `<div class="step">Key press ${s + 1} of ${steps.length} · ${esc(st.label)}</div>` : "";
      // questions and cues carry the span count before them, so they dim once you've spoken past them
      col.innerHTML = head + st.items.map(it => it.t === "q" ? `<div class="q" data-at="${n}">${esc(it.x)}</div>` : it.t === "c" ? `<p class="c" data-at="${n}">${esc(it.x)}</p>` : para(it.x)).join("");
    }
    els = [...col.querySelectorAll(".w")]; blocks = [...col.querySelectorAll("[data-at]")];
    cursor = 0; base = finals.length; hits = new Set(); target = 0; scroller.scrollTop = 0; takeBack();
    visit = { id: RUN + "-" + ++seq, run: RUN, scene: id, step: s, label: steps[s]?.label || "", at: Date.now(), heard: [], adlib: [], paras, hits };
    if (segs.length && partialRaw) segs.push({ v: visit, at: partialRaw.split(/\s+/).length }); // mid-phrase: the rest of it is this key press's

    els.forEach((el, i) => el.classList.toggle("said", dim[i] === 1));

    const el = els[spans[cursor]] || els[spans[cursor - 1]]; if (!el) return;

  // through several key presses. Each key press gets the words that came after it: segs marks where in the live
  // guess each one started. shortcut: offsets are counted on the live guess, so a final that rewords it can shift
  // a word or two across the cut; fine for learning, not exact.
  function onPartial(text) { if (!segs.length && text) segs = [{ v: visit, at: 0 }]; partialRaw = (text || "").trim(); partial = Tele.words(text || ""); heard(); }
  function onFinal(text) {

    const pw = Tele.words(t); finals.push(...pw); partial = []; heard();

      p.v.heard.push(part);

  function learnLabel() {
    const runs = new Set(store.rows.map(r => r.run)).size;
    learnBtn.textContent = learn ? `Learning from your runs · ${runs} so far · on` : "Learning off · click to turn on";
  }
  learnBtn.addEventListener("click", () => { learn = !learn; try { localStorage.setItem("prompter-learn", learn ? "on" : "off"); } catch (e) {} learnLabel(); });
  learnLabel();
  (async () => {
    if (!window.claude?.use) return; // local preview: records stay in memory
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = db && user ? await user.id() : null;
    if (!uid) { learnBtn.hidden = true; return; }
    const vis = db.doc("data/users/" + uid + "/prompter").collection("visits");
    store.save = (id, doc) => vis.doc(id).set(doc).catch(e => console.warn("prompter: record not saved", e?.code));
    const snap = await Promise.race([vis.orderBy("at", "desc").limit(400).get().catch(() => null), new Promise(r => setTimeout(() => r(null), 10000))]);
    if (!snap) return;
    const have = new Set(store.rows.map(r => r.id));

  })();

  // Scroll yourself and the prompter lets go. It follows again once your place is on screen and you've left

function goTo(id) { const i = Reveal.getSlides().findIndex(s => s.dataset.scene === id); if (i >= 0) { navJump = true; Reveal.slide(i); } }
/* Chapter transitions (deck.py CHAPTERS = True): stepping forward from a case's last slide into the next case's opener, the
   finished slide fades out and its logo holds a beat in the centre, then shrinks left and fades well before the edge while the
   next case's logo bumps in and fades up; then the logo fades out and the opener fades in.
   Forward steps only; card and menu jumps, going back, scroll view, print and reduced motion keep the normal fade. */
let navJump = false, chapTl = null;
const CHAP = DECK.chapters || {};
const chapEl = document.body.appendChild(Object.assign(document.createElement("div"), { id: "chap", innerHTML: "<img class=\"c-out\" alt=\"\"><img class=\"c-in\" alt=\"\">" }));
function chapter(e) {
  const jump = navJump; navJump = false;
  if (chapTl) chapTl.progress(1);
  const to = e.currentSlide, from = e.previousSlide, pair = to && CHAP[to.dataset.scene];
  if (!pair || jump || !from || reduce || scrollView || !window.gsap || document.documentElement.classList.contains("print-pdf")) return false;
  if (Reveal.getSlides().indexOf(from) !== e.indexh - 1) return false;
  const [a, b] = pair, vw = innerWidth, oi = chapEl.querySelector(".c-out"), ii = chapEl.querySelector(".c-in");
  oi.src = a ? ART["logo-" + a] : ""; ii.src = b ? ART["logo-" + b] : ""; oi.style.display = a ? "" : "none"; ii.style.display = b ? "" : "none"; oi.dataset.k = a || ""; ii.dataset.k = b || ""; /* a case's CSS can size its own mark: #chap img[data-k=...] */

  gsap.set(from, { visibility: "visible", opacity: 1, transition: "none", zIndex: 3 });
  gsap.set(to, { visibility: "visible", opacity: 0, transition: "none" });
  gsap.set([oi, ii], { xPercent: -50, yPercent: -50, x: 0, scale: 1, opacity: 0 });
  // hide the old slide before its props clear, so reveal's fade never replays it in place
  const done = () => { gsap.set(from, { opacity: 0 }); gsap.set([from, to], { clearProps: "visibility,zIndex" }); gsap.set(to, { opacity: 1 }); chapEl.style.display = "none"; chapTl = null;
    requestAnimationFrame(() => gsap.set([from, to], { clearProps: "opacity,transition" })); };
  chapTl = gsap.timeline({ onComplete: done, onInterrupt: done });
  chapTl.to(from, { opacity: 0, duration: 0.25, ease: "power1.out" }, 0);

  if (a) { chapTl.fromTo(oi, { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "power2.out" }, t);
    chapTl.to(oi, { x: -vw * 0.12, scale: 0.55, duration: 0.3, ease: "power2.out" }, t + 0.24);
    chapTl.to(oi, { opacity: 0, duration: 0.24, ease: "power1.in" }, t + 0.24); t += 0.27; }
  if (b) { chapTl.fromTo(ii, { x: vw * 0.1, scale: 0.8, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, t); t += 0.45; }
  else t += 0.15;
  if (b) chapTl.to(ii, { opacity: 0, scale: 1.04, duration: 0.2, ease: "power1.in" }, t);
  chapTl.call(() => play(to), null, t); // the opener's entrance sets its first frame before it fades in, never after
  chapTl.to(to, { opacity: 1, duration: 0.3, ease: "power1.out" }, t + 0.05);

}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { e.preventDefault(); goTo(b.dataset.go); } });
document.getElementById("btn-cases").addEventListener("click", () => goTo("cases"));

const scrollView = location.hash === "#scroll"; const btnView = document.getElementById("btn-view");
btnView.setAttribute("aria-pressed", String(scrollView)); btnView.textContent = scrollView ? "Slide view" : "Scroll view";
// reveal.js reads its view mode only at start, so switching reloads the page on the #scroll address
function toggleView() { location.hash = scrollView ? "slides" : "scroll"; location.reload(); }
btnView.addEventListener("click", toggleView);
document.getElementById("btn-full").addEventListener("click", () => { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen?.())?.catch?.(() => {}); });

const tools = document.querySelector(".tools"); let lastIdx = 0;
function updateTools(i) { tools.classList.toggle("hide", !(i === 0 || i < lastIdx)); lastIdx = i; }

if (role === "notes") {
  startPresenter();
} else {
  document.addEventListener("keydown", e => {
    if (e.target.closest("input,textarea,select")) return;

  });
}
